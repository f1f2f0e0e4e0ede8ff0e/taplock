<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Block diagram: card, RC522 reader, Arduino UNO, then servo, buzzer and serial log">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1C1C1E"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1C1C1E" stroke-width="1.5">
    <rect x="20" y="96" width="150" height="68" rx="10"/>
    <rect x="250" y="96" width="170" height="68" rx="10"/>
    <rect x="500" y="96" width="170" height="68" rx="10"/>
    <rect x="740" y="20" width="140" height="60" rx="10"/>
    <rect x="740" y="110" width="140" height="60" rx="10"/>
    <rect x="740" y="200" width="140" height="56" rx="10"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1C1C1E" text-anchor="middle">
